<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* touch-action / overscroll : sur mobile, le glissement doit faire tourner le
   modele et non defiler la page qui contient la WebView. */
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #2D2D2D;
  touch-action: none;
  overscroll-behavior: none;
}
canvas { display: block; touch-action: none; }
#info { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
        color: #666; font-family: sans-serif; font-size: 12px; pointer-events: none;
        text-align: center; max-width: 95%; }
</style>
</head>
<body>
<div id="info">Chargement du visualiseur 3D...</div>
<script>
  // ------------------------------------------------------------------
  // Journal du viewer.
  // 1. Le message est affiche directement a l'ecran (div #info) : sur
  //    telephone c'est le diagnostic le plus simple, il suffit de regarder.
  // 2. Il est empile dans window.__viewerLog, que l'app lit ensuite via
  //    EvaluateJavaScriptAsync pour l'ecrire dans son journal de debug.
  //
  // NB : surtout PAS de "window.location.href = schema-maison://..." ici.
  // Android quitte la page sur un schema d'URL inconnu (ERR_UNKNOWN_URL_SCHEME)
  // si l'app ne l'intercepte pas -> le viewer se sabordait lui-meme des que
  // l'APK installe etait plus ancien que la page servie par le NAS.
  // ------------------------------------------------------------------
  window.__viewerLog = [];

  function reportLog(message, fatal) {
    window.__viewerLog.push((fatal ? '[ERREUR] ' : '') + message);
    if (window.__viewerLog.length > 50) window.__viewerLog.shift();

    var info = document.getElementById('info');
    if (info) {
      info.textContent = message;
      info.style.color = fatal ? '#ff6b6b' : '#666';
    }
  }

  // Appelee par l'app (C#) pour recuperer le journal accumule.
  window.__lireLog = function () {
    return window.__viewerLog.join('\n');
  };

  // Les erreurs de chargement de ressource (module JS introuvable) ne
  // remontent qu'en phase de capture, d'ou le troisieme argument "true".
  window.addEventListener('error', function (e) {
    if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
      reportLog('Script introuvable : ' + (e.target.src || e.target.href), true);
      return;
    }
    reportLog('Erreur script : ' + (e.message || e.error || 'inconnue'), true);
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    var raison = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
    reportLog('Promesse rejetee : ' + raison, true);
  });

  // ------------------------------------------------------------------
  // File d'attente pour window.loadModel : le client appelle loadModel()
  // des que la page a fini de naviguer, sans attendre que ce module soit
  // pret. Sans cette file, l'appel se perdrait silencieusement.
  // ------------------------------------------------------------------
  window.__pendingModel = null;
  window.loadModel = function (url, extension) {
    window.__pendingModel = { url: url, extension: extension };
  };
</script>
<script type="module">
// Three.js est heberge par le serveur (wwwroot/vendor/three) et non plus charge
// depuis un CDN : le telephone n'a pas forcement acces a Internet alors qu'il
// joint le NAS, et les import-maps ne sont pas supportees par les vieux WebView.
import * as THREE from './vendor/three/three.module.min.js';
import { OrbitControls } from './vendor/three/addons/controls/OrbitControls.js';
import { STLLoader } from './vendor/three/addons/loaders/STLLoader.js';
import { OBJLoader } from './vendor/three/addons/loaders/OBJLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2D2D2D);

const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100000);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  reportLog('WebGL indisponible sur cet appareil : ' + e.message, true);
  throw e;
}
renderer.setPixelRatio(window.devicePixelRatio || 1);
document.body.appendChild(renderer.domElement);

// ------------------------------------------------------------------
// Dimensionnement robuste.
// Sur Android, la WebView est encore masquee (Visibility.Gone) au moment ou
// la page se charge : window.innerWidth/innerHeight valent alors 0, ce qui
// donne un canvas 0x0 et un ratio de camera NaN -> plus rien ne s'affiche,
// meme une fois la WebView rendue visible. On ignore donc les tailles nulles
// et on re-dimensionne des que la taille reelle est connue (ResizeObserver).
// ------------------------------------------------------------------
let largeurCourante = 0, hauteurCourante = 0;

function ajusterTaille() {
  const largeur = window.innerWidth || document.documentElement.clientWidth || 0;
  const hauteur = window.innerHeight || document.documentElement.clientHeight || 0;

  if (largeur <= 0 || hauteur <= 0) return false;              // WebView encore masquee
  if (largeur === largeurCourante && hauteur === hauteurCourante) return true;

  largeurCourante = largeur;
  hauteurCourante = hauteur;
  camera.aspect = largeur / hauteur;
  camera.updateProjectionMatrix();
  renderer.setSize(largeur, hauteur);
  return true;
}

ajusterTaille();
window.addEventListener('resize', ajusterTaille);
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(ajusterTaille).observe(document.documentElement);
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const d1 = new THREE.DirectionalLight(0xffffff, 1.2);
d1.position.set(1, 2, 3);
scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.4);
d2.position.set(-2, -1, -1);
scene.add(d2);

function clearMeshes() {
  scene.children.filter(c => !c.isLight).forEach(c => scene.remove(c));
}

function centerAndFit(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  obj.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  camera.position.set(maxDim * 0.8, maxDim * 0.6, maxDim * 1.2);
  camera.near = maxDim / 1000;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

const mat = new THREE.MeshStandardMaterial({ color: 0x00aaff, metalness: 0.25, roughness: 0.65 });
const AIDE = 'Clic gauche = rotation · Clic droit = panoramique · Molette = zoom';

// ------------------------------------------------------------------
// Suivi du telechargement : pourcentage, volumes et debit.
// Un fichier 3D peut peser plusieurs centaines de Mo ; sans retour visuel,
// l'attente est indistinguable d'un blocage.
// ------------------------------------------------------------------
function formaterOctets(octets) {
  if (!isFinite(octets) || octets < 0) return '?';
  if (octets < 1024) return octets + ' o';
  if (octets < 1024 * 1024) return (octets / 1024).toFixed(0) + ' Ko';
  if (octets < 1024 * 1024 * 1024) return (octets / (1024 * 1024)).toFixed(1) + ' Mo';
  return (octets / (1024 * 1024 * 1024)).toFixed(2) + ' Go';
}

function creerSuiviTelechargement() {
  const debut = performance.now();
  let dernierAffichage = 0;

  return function (evenement) {
    const maintenant = performance.now();
    // Limiter les mises a jour : le rendu du texte ne doit pas freiner le transfert.
    if (maintenant - dernierAffichage < 150 && evenement.loaded !== evenement.total) return;
    dernierAffichage = maintenant;

    const secondes = (maintenant - debut) / 1000;
    const debit = secondes > 0 ? evenement.loaded / secondes : 0;
    const vitesse = formaterOctets(debit) + '/s';

    // La taille totale n'est connue que si le serveur annonce un Content-Length
    // (ce qu'il fait desormais, y compris pour un fichier extrait d'une archive).
    if (evenement.lengthComputable && evenement.total > 0) {
      const pourcent = Math.floor((evenement.loaded / evenement.total) * 100);
      reportLog('Telechargement ' + pourcent + ' %  ·  '
        + formaterOctets(evenement.loaded) + ' / ' + formaterOctets(evenement.total)
        + '  ·  ' + vitesse, false);
    } else {
      reportLog('Telechargement  ·  ' + formaterOctets(evenement.loaded)
        + '  ·  ' + vitesse, false);
    }
  };
}

window.loadModel = function (url, extension) {
  reportLog('Telechargement du fichier 3D...', false);
  clearMeshes();
  ajusterTaille();

  const ext = (extension || '').toLowerCase();
  const onProgress = creerSuiviTelechargement();
  const onError = function (err) {
    const detail = err && (err.message || err.type || err.status) ? (err.message || err.type || err.status) : err;
    reportLog('Chargement du fichier 3D echoue : ' + detail, true);
  };
  const onLoaded = function () {
    ajusterTaille();
    reportLog(AIDE, false);
  };
  const surAnalyse = function () {
    // Entre la fin du transfert et l'affichage, le decodage d'un gros maillage
    // peut prendre plusieurs secondes : on le dit plutot que de figer l'ecran.
    reportLog('Analyse du modele...', false);
  };

  if (ext === '.stl') {
    new STLLoader().load(url, function (geometry) {
      surAnalyse();
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, mat);
      scene.add(mesh);
      centerAndFit(mesh);
      onLoaded();
    }, onProgress, onError);
  } else if (ext === '.obj') {
    new OBJLoader().load(url, function (group) {
      surAnalyse();
      group.traverse(c => { if (c.isMesh) c.material = mat; });
      scene.add(group);
      centerAndFit(group);
      onLoaded();
    }, onProgress, onError);
  } else {
    reportLog('Extension non geree par l\'apercu 3D : ' + ext, true);
  }
};

(function animate() {
  requestAnimationFrame(animate);
  // La taille reelle n'est parfois connue qu'apres l'affichage de la WebView.
  if (largeurCourante === 0) ajusterTaille();
  controls.update();
  renderer.render(scene, camera);
})();

// Rejouer une demande de chargement recue avant que ce module soit pret.
if (window.__pendingModel) {
  const attente = window.__pendingModel;
  window.__pendingModel = null;
  window.loadModel(attente.url, attente.extension);
} else {
  reportLog('Visualiseur 3D pret.', false);
}
</script>
</body>
</html>
